---
kind: "Pod"
name: "jenkins-agent"
metadata:
  namespace: ${YAML_METADATA_NAMESPACE}
spec:
  containers:
    - name: "maven"
      tty: true
      command:
        - "cat"
      image: "maven:3.6.3-openjdk-8"
      imagePullPolicy: "IfNotPresent"
      volumeMounts:
        - name: "jenkins-common"
          mountPath: /root/.m2/repository
          subPath: "maven_repo"
        - mountPath: "/root/.m2/settings.xml"
          name: "maven-settings"
          readOnly: false
          subPath: "settings.xml"
        - name: "jenkins-common"
          mountPath: /var/jacoco
          subPath: "jacoco"
        - name: "jenkins-common"
          mountPath: /tools
          subPath: "tools"
        - name: "kyligence-repo"
          mountPath: /root/.m2/repository/io/kyligence
        - name: "kylin-repo"
          mountPath: /root/.m2/repository/org/apache/kylin
        - name: "spark-repo"
          mountPath: /root/.m2/repository/org/apache/spark
        - name: "dockersock"
          mountPath: "/var/run/docker.sock"
      resources:
        requests:
          memory: "32Gi"
          cpu: "8"
          ephemeral-storage: "5Gi"
    - name: "sonar"
      tty: true
      command:
        - "cat"
      image: "maven:3.6.3-openjdk-11"
      imagePullPolicy: "IfNotPresent"
      volumeMounts:
        - name: "jenkins-common"
          mountPath: /root/.m2/repository
          subPath: "maven_repo"
        - mountPath: "/root/.m2/settings.xml"
          name: "maven-settings"
          readOnly: false
          subPath: "settings.xml"
      resources:
        requests:
          memory: "4Gi"
          cpu: "2"
          ephemeral-storage: "2Gi"
    - image: "jenkins/inbound-agent:4.11-1-jdk11"
      name: "jnlp"
      resources:
        requests:
          memory: "1Gi"
          cpu: "1"
  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "${YAML_PVC_JENKINSCOMMON_NAME}"
    - name: "kyligence-repo"
      emptyDir: { }
    - name: "kylin-repo"
      emptyDir: { }
    - name: "spark-repo"
      emptyDir: { }
    - configMap:
        defaultMode: 0777
        items:
          - key: "settings.xml"
            path: "settings.xml"
        name: "aws-maven-settings"
      name: "${YAML_CM_MAVENSETTINGS_NAME}"
    - name: "dockersock"
      hostPath:
        path: "/var/run/docker.sock"
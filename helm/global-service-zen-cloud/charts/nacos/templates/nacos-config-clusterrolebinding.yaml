apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nacos.fullname" . }}-config-clusterrolebinding-{{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nacos.fullname" . }}-config-clusterrole-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "nacos.serviceAccountName" . }}-config
    namespace: {{ .Release.Namespace }}

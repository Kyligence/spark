apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nacos-frontend.fullname" . }}-nginx-cm
data:
  default.conf: |-
    server {
      listen       80;
      listen  [::]:80;
      server_name  localhost;

      location /ka-iam/api {
        rewrite ^/ka-iam(.*)$ /saas-kyiam/$1 break;
        proxy_pass {{ .Values.gateway.serverAddr }};
      }

      location /nacos/api {
        rewrite ^/nacos(.*)$ /nacos-config/nacos/$1 break;
        proxy_pass {{ .Values.gateway.serverAddr }};
      }

      location /nacos {
        rewrite ^/nacos(.*)$ $1 break;
        root  /usr/share/nginx/html;
        index  index.html;
        try_files $uri /index.html;
      }

      location / {
        root  /usr/share/nginx/html;
        index  index.html;
        try_files $uri /index.html;
      }
    }
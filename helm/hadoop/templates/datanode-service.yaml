apiVersion: v1
kind: Service
metadata:
  name: {{ include "hdfs.fullname" . }}-datanode
  labels:
    metrics-exporter: prometheus
spec:
  clusterIP: None
  ports:
    - name: "50075"
      port: 50075
      targetPort: 50075
    - port: 8080
      name: metrics
  selector:
    io.kompose.service: {{ include "hdfs.fullname" . }}-datanode
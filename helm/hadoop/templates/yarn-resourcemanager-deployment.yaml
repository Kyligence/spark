apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: {{ include "hdfs.fullname" . }}-yarn-resourcemanager
  name: {{ include "hdfs.fullname" . }}-yarn-resourcemanager
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.resourcemanager.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      io.kompose.service: {{ include "hdfs.fullname" . }}-yarn-resourcemanager
  strategy:
    type: {{ .Values.namenode.strategy }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        io.kompose.service: {{ include "hdfs.fullname" . }}-yarn-resourcemanager
    spec:
      volumes:
      - name: config
        configMap:
          name: {{ include "hdfs.fullname" . }}-yarn-xml
      - name: exporter-dir
        emptyDir: {}
      - name: jmx-config
        configMap:
          name: {{ include "hdfs.fullname" . }}-jmx-exporter-config
      {{- if .Values.jmx.enabled }}
      initContainers:
        - name: jmx-exporter
          image: "{{ .Values.jmx.image.repository }}:{{ .Values.jmx.image.tag }}"
          volumeMounts:
            - name: exporter-dir
              mountPath: /opt/jmx-exporter/
          command: ["cp", "/opt/jmx_prometheus_javaagent-0.16.1.jar", "/opt/jmx-exporter/"]
      {{- end }}
      containers:
      - name: {{ include "hdfs.fullname" . }}yarn-resourcemanager
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        volumeMounts:
        - name: config
          mountPath: /etc/hadoop/fair-scheduler.xml
          subPath: fair-scheduler.xml
        - name: exporter-dir
          mountPath: /opt/jmx-exporter/
        - name: jmx-config
          mountPath: /opt/jmx-exporter/config.yaml
          subPath: config.yaml
        ports:
          - containerPort: 8088
          - containerPort: 8030
          - containerPort: 8031
          - containerPort: 8032
          - containerPort: 8033
          - containerPort: 8080
            name: metrics
        livenessProbe:
          failureThreshold: 20
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          httpGet:
            path: /
            port: 8088
        readinessProbe:
          failureThreshold: 20
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          httpGet:
            path: /
            port: 8088
        envFrom:
        - configMapRef:
            name: {{ include "hdfs.fullname" . }}-yarn-env
        env:
        - name: HADOOP_MODE
          value: resourcemanager
        - name: HADOOP_WEBHDFS_PORT
          value: "50070"
        - name: FORMAT_MESSAGES_PATTERN_DISABLE_LOOKUPS
          value: "true"
        - name: SERVICE_PRECONDITION
          value: {{ include "hdfs.fullname" . }}-namenode:{{ .Values.namenode.web_hdfs_port }} {{ include "hdfs.fullname" . }}-datanode:{{ .Values.namenode.port }}
        # - name: YARN_OPTS
        #   value: -javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent-0.16.1.jar=8080:/opt/jmx-exporter/config.yaml

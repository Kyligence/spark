apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    io.kompose.service: {{ include "hdfs.fullname" . }}-namenode-claim0
  name: {{ include "hdfs.fullname" . }}-namenode-claim0
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.namenode.storageSize }}
  storageClassName: {{ .Values.namenode.storageClassName }}

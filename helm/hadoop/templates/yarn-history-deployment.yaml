apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: {{ include "hdfs.fullname" . }}-yarn-historyserver
  name: {{ include "hdfs.fullname" . }}-yarn-historyserver
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.historyserver.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      io.kompose.service: {{ include "hdfs.fullname" . }}-yarn-historyserver
  strategy:
    type: {{ .Values.namenode.strategy }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        io.kompose.service: {{ include "hdfs.fullname" . }}-yarn-historyserver
    spec:
      {{- if .Values.jmx.enabled }}
      initContainers:
        - name: jmx-exporter
          image: "{{ .Values.jmx.image.repository }}:{{ .Values.jmx.image.tag }}"
          volumeMounts:
            - name: exporter-dir
              mountPath: /opt/jmx-exporter/
          command: ["cp", "/opt/jmx_prometheus_javaagent-0.16.1.jar", "/opt/jmx-exporter/"]
      {{- end }}
      containers:
      - name: {{ include "hdfs.fullname" . }}yarn-historyserver
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        livenessProbe:
          failureThreshold: 20
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          httpGet:
            path: /
            port: {{ .Values.historyserver.port }}
        readinessProbe:
          failureThreshold: 20
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          httpGet:
            path: /
            port: {{ .Values.historyserver.port }}
        ports:
          - containerPort: {{ .Values.historyserver.port }}
        volumeMounts:
          - mountPath: /hadoop/yarn/timeline
            name: yarn-historyserver-claim0
          - name: exporter-dir
            mountPath: /opt/jmx-exporter/
          - name: jmx-config
            mountPath: /opt/jmx-exporter/config.yaml
            subPath: config.yaml
        envFrom:
        - configMapRef:
            name: {{ include "hdfs.fullname" . }}-yarn-env
        env:
        - name: HADOOP_MODE
          value: historyserver
        - name: HADOOP_WEBHDFS_PORT
          value: "50070"
        - name: FORMAT_MESSAGES_PATTERN_DISABLE_LOOKUPS
          value: "true"
        - name: YARN_OPTS
          value: -javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent-0.16.1.jar=8080:/opt/jmx-exporter/config.yaml
      volumes:
        - name: yarn-historyserver-claim0
          persistentVolumeClaim:
            claimName: {{ include "hdfs.fullname" . }}-yarn-historyserver-claim0
        - name: exporter-dir
          emptyDir: {}
        - name: jmx-config
          configMap:
            name: {{ include "hdfs.fullname" . }}-jmx-exporter-config

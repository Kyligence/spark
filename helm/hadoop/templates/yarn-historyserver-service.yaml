apiVersion: v1
kind: Service
metadata:
  name: {{ include "hdfs.fullname" . }}-yarn-historyserver
  labels:
    metrics-exporter: prometheus
spec:
  ports:
    - name: "8188"
      port: 8188
      targetPort: 8188
    - port: 8080
      name: metrics
  selector:
    io.kompose.service: {{ include "hdfs.fullname" . }}-yarn-historyserver

# Default values for hdfs.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: repo-ofs.kyligence.com/hadoop
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "2.10.1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}


jmx:
  enabled: true
  image: 
    repository: repo-ofs.kyligence.com/jmx-prometheus-javaagent
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "0.16.1"

namenode:
  replicaCount: 1
  strategy: Recreate
  cluster_name: test-kylin
  port: 50075
  web_hdfs_port: 50070
  storageSize: 5Gi
  storageClassName: local-path
  ingress:
    enabled: true
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: namenode.dev.kylincorp.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
  

datanode:
  replicaCount: 3
  web_hdfs_port: 50070
  storageSize: 10Gi
  storageClassName: local-path

mysql:
  replicaCount: 1
  port: 3306
  password: a3lsaWdlbmNl
  storageSize: 5Gi
  storageClassName: local-path
  image: 
    repository: mysql
    pullPolicy: IfNotPresent
    tag: "5.7"

  prometheus:
    port: 9104
    image: 
      repository: prom/mysqld-exporter
      pullPolicy: IfNotPresent
      tag: "v0.13.0"


hive:
  imagePullSecrets: docker-registry-secret
  image: 
    repository: repo-ofs.kyligence.com/hive
    pullPolicy: IfNotPresent
    tag: "1.2.2-hadoop-2.10.1"


hive_metastore:
  replicaCount: 1
  port: 9083

hive_server2:
  replicaCount: 1
  port: 10000
  
resourcemanager:
  replicaCount: 1
  port: 8088
  ingress:
      enabled: true
      className: ""
      annotations: {}
        # kubernetes.io/ingress.class: nginx
        # kubernetes.io/tls-acme: "true"
      hosts:
        - host: resourcemanager.dev.kylincorp.com
          paths:
            - path: /
              pathType: Prefix
      tls: []

historyserver:
  replicaCount: 1
  port: 8188
  storageSize: 5Gi
  storageClassName: local-path
  ingress:
    enabled: true
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: historyserver.dev.kylincorp.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

zookeeper:
  replicaCount: 1
  updateStrategy: RollingUpdate
  imagePullSecrets: docker-registry-secret
  storageSize: 1Gi
  storageClassName: local-path
  image: 
    repository: repo-ofs.kyligence.com/kubernetes-zookeeper
    pullPolicy: IfNotPresent
    tag: "1.0-3.4.10"

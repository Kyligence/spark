apiVersion: v1
kind: ConfigMap
metadata:
  name: saas-kyiam
data:
  config.yaml: |
    spring:
      datasource:
        driver-class-name: {{ .Values.config.db.driverClassName }}
        # url: {{ .Values.config.db.url }}
        url: jdbc:mysql://{{.Values.config.mysql.host | default .Values.mysql.host}}:{{ .Values.config.mysql.port  | default .Values.mysql.port }}/saas_kyiam?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false
        username: ${MYSQL_DATABASE_USERNAME}
        password: ${MYSQL_DATABASE_PASSWORD}
      redis:
        host: {{ .Values.config.redis.host }}
        database: {{ .Values.config.redis.database }}
        password: {{ .Values.config.redis.password }}
    saas:
      nacos:
        discovery:
          group: {{ ((.Values.config).discovery).group | default .Release.Namespace }}
          public-group: {{ ((.Values.config).discovery).publicGroup | default .Release.Namespace }}
          server-addr: {{ .Values.nacos.discovery.serverAddr }}
        config:
          server-addr: {{ .Values.nacos.config.serverAddr }}
    kyligence:
      user:
        msg:
          webhook: {{ .Values.kyligence.webhook }}
        sync:
          enable: {{ .Values.kyligence.sync }}
      request:
        domain: {{ .Values.kyligence.request.domain }}
  IAM_DEPLOY_MODE: {{ .Values.kyligence.deployMode }}
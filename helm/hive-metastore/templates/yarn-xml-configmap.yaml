apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hdfs.fullname" . }}-yarn-xml
data:
  core-site.xml: |
    <configuration>
      <!-- 以下是 HDFS 客户端配置 -->
      <property>
        <name>fs.defaultFS</name>
        <value>s3a://{{ .Values.s3.bucket }}</value>
      </property>
      <!-- 以下是 通用 客户端配置 -->
      <property>
        <name>io.compression.codecs</name>
        <value>org.apache.hadoop.io.compress.SnappyCodec</value>
      </property>
      <property>
          <name>hadoop.proxyuser.root.hosts</name>
          <value>*</value>
      </property>
      <property>
          <name>hadoop.proxyuser.root.groups</name>
          <value>*</value>
      </property>
      <property>
          <name>fs.s3a.access.key</name>
          <value>{{ .Values.s3.ak }}</value>
      </property>
      <property>
          <name>fs.s3a.secret.key</name>
          <value>{{ .Values.s3.sk }}</value>
      </property>
      <property>
          <name>fs.s3a.endpoint</name>
          <value>{{ .Values.s3.endpoint }}</value>
      </property>
    </configuration>
  hive-site.xml: |
    <configuration>
      <!-- 以下是hive metastore配置 -->       
      <property>
          <name>javax.jdo.option.ConnectionDriverName</name>
          <value>com.mysql.jdbc.Driver</value>
      </property>
      <property>
          <name>javax.jdo.option.ConnectionURL</name>
          <value>jdbc:mysql://{{ .Values.mysql.address }}:{{ .Values.mysql.port }}/{{ .Values.mysql.hiveDB }}?UseUnicode=true&amp;characterEncoding=utf8&amp;characterSetResults=UTF-8&amp;serverTimezone=UTC&amp;useSSL=false&amp;verifyServerCertificate=false</value>
      </property>
      <property>
          <name>javax.jdo.option.ConnectionUserName</name>
          <value>{{ .Values.mysql.username }}</value>
      </property>
      <property>
          <name>javax.jdo.option.ConnectionPassword</name>
          <value>{{ .Values.mysql.password }}</value>
      </property>
      <property>
          <name>hive.metastore.port</name>
          <value>9083</value>
      </property>


      <!-- 以下是hive server2配置 -->
      <property>
          <name>hive.server2.thrift.min.worker.threads</name>
          <value>5</value>
      </property>
      <property>
          <name>hive.server2.thrift.max.worker.threads</name>
          <value>500</value>
      </property>
      <property>
          <name>hive.server2.thrift.port</name>
          <value>10000</value>
      </property>
      <property>
          <name>hive.server2.webui.port</name>
          <value>10002</value>
      </property>
      <property>
          <name>hive.metastore.uris</name>
          <value>thrift://{{ include "hdfs.fullname" . }}-hive-metastore:9083</value>
      </property>
      <property>
          <name>hive.scratch.dir.permission</name>
          <value>777</value>
      </property>
      <property>
          <name>hive.exec.scratchdir</name>
          <value>/user/hive/scratch</value>
      </property>
      <property>
          <name>hive.metastore.warehouse.dir</name>
          <value>/user/hive/warehouse</value>
      </property>
    </configuration>
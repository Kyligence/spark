kind: ConfigMap
apiVersion: v1
metadata:
  name: hadoop-yarn-xml
data:
  core-site.xml: |
    <configuration>
        <!-- 以下是 HDFS 客户端配置 -->
        <property>
           <name>fs.defaultFS</name>
           <value>s3a://{{ .Values.global.s3.bucket }}</value>
        </property>
        <!-- 以下是 通用 客户端配置 -->
        <property>
          <name>io.compression.codecs</name>
          <value>org.apache.hadoop.io.compress.SnappyCodec</value>
        </property>
        <property>  
            <name>hadoop.proxyuser.root.hosts</name>
            <value>*</value>
        </property>
        <property>
            <name>hadoop.proxyuser.root.groups</name>
            <value>*</value>
        </property>
        <property>
            <name>fs.s3a.access.key</name>
            <value>{{ .Values.global.s3.ak }}</value>
        </property>
        <property>
            <name>fs.s3a.secret.key</name>
            <value>{{ .Values.global.s3.sk }}</value>
        </property>
        <property>
            <name>fs.s3a.endpoint</name>
            <value>{{ .Values.global.s3.endpoint }}</value>
        </property>
        <property>
            <name>fs.s3a.aws.enabled</name>
            <value>false</value>
        </property>
    </configuration>
  hive-site.xml: |
    <configuration>
       <property>
          <name>hive.server2.thrift.min.worker.threads</name>
          <value>5</value>
       </property>
       <property>
          <name>hive.server2.thrift.max.worker.threads</name>
          <value>500</value>
       </property>
       <property>
          <name>hive.server2.thrift.port</name>
          <value>10000</value>
       </property>
       <property>
          <name>hive.server2.webui.port</name>
          <value>10002</value>
       </property>
       <property>
          <name>hive.metastore.uris</name>
          <value>thrift://{{ .Values.global.metastore.uris }}</value>
       </property>
       <property>
          <name>hive.scratch.dir.permission</name>
          <value>777</value>
       </property>
       <property>
          <name>hive.exec.scratchdir</name>
          <value>/user/hive/scratch</value>
       </property>
       <property>
          <name>hive.metastore.warehouse.dir</name>
          <value>/user/hive/warehouse</value>
       </property>
    </configuration>

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: yinglong-service-binding
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: spark
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.sparkRole }}-{{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" . | nindent 6 }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gateway.selectorLabels" . | nindent 8 }}
        app: saas-gateway-{{ .Release.Namespace }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gateway.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.skyWalking.enabled }}
      initContainers:
        - name: agent-container
          image: apache/skywalking-java-agent:8.10.0-alpine
          resources:
            limits:
              cpu: 200m
              memory: 200Mi
            requests:
              cpu: 200m
              memory: 200Mi
          volumeMounts:
            - name: skywalking-agent
              mountPath: /agent
          command:
            - sh
            - "-c"
            - |
              cp -R /skywalking/agent /agent/
              rm /agent/agent/plugins/apm-springmvc-annotation-5.x-plugin-8.10.0.jar
              rm /agent/agent/plugins/apm-springmvc-annotation-4.x-plugin-8.10.0.jar
              rm /agent/agent/plugins/apm-springmvc-annotation-3.x-plugin-8.10.0.jar
              cp /agent/agent/optional-plugins/apm-spring-cloud-gateway-3.x-plugin-8.10.0.jar /agent/agent/plugins/apm-spring-cloud-gateway-3.x-plugin-8.10.0.jar
              cp /agent/agent/optional-plugins/apm-spring-webflux-5.x-plugin-8.10.0.jar /agent/agent/plugins/apm-spring-webflux-5.x-plugin-8.10.0.jar
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          livenessProbe:
            failureThreshold: 5
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            httpGet:
              path: /actuator/health
              port: 8080
          readinessProbe:
            failureThreshold: 5
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            httpGet:
              path: /actuator/health
              port: 8080
          env:
            - name: TENANT_NAME
              value: "{{ .Values.tenantName }}"
            {{- if .Values.skyWalking.enabled }}
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/skywalking/agent/skywalking-agent.jar -Dspring.profiles.active=nacos -Dsaas.nacos.discovery.group={{ .Values.global.tenantId }} -Dsaas.nacos.discovery.public-group={{ .Values.global.publicGroup }} -Dsaas.nacos.discovery.server-addr={{ .Values.global.nacos.discovery.serverAddrNoHttp }}  -Dsaas.nacos.config.server-addr={{ .Values.global.nacos.config.serverAddrNoHttp }} -Dkyligence.saas-gateway.deploy-model=KA"
            - name: SW_AGENT_NAME
              value: "Kyligence"
            - name: SW_AGENT_COLLECTOR_BACKEND_SERVICES
              value: "{{ .Values.skyWalking.serverAddr }}"
            {{- else }}
            - name: JAVA_TOOL_OPTIONS
              value: "-Dspring.profiles.active=nacos -Dsaas.nacos.discovery.group={{ .Values.global.tenantId }} -Dsaas.nacos.discovery.public-group={{ .Values.global.publicGroup }} -Dsaas.nacos.discovery.server-addr={{ .Values.global.nacos.discovery.serverAddrNoHttp }}  -Dsaas.nacos.config.server-addr={{ .Values.global.nacos.config.serverAddrNoHttp }} -Dkyligence.saas-gateway.deploy-model=KA"
            {{- end }}
          volumeMounts:
            - mountPath: "/etc/saas-gateway/config.yaml"
              name: "saas-gateway"
              readOnly: false
              subPath: "config.yaml"
            {{- if .Values.skyWalking.enabled }}
            - name: skywalking-agent
              mountPath: /skywalking
            {{- end }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - configMap:
            defaultMode: 0777
            items:
              - key: "config.yaml"
                path: "config.yaml"
            name: "saas-gateway"
          name: "saas-gateway"
        {{- if .Values.skyWalking.enabled }}
        - name: skywalking-agent
          emptyDir: { }
        {{- end }}
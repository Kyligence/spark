apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.sparkRoleBinding }}-{{ .Release.Namespace }}
  namespace: {{ .Values.sparkResourceNamespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.sparkRole }}-{{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io
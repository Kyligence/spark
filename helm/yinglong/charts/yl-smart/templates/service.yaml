apiVersion: v1
kind: Service
metadata:
  name: {{ include "yl-smart.fullname" . }}
  labels:
    {{- include "yl-smart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.debugPort }}
      targetPort: debug
      protocol: TCP
      name: debug
  selector:
    {{- include "yl-smart.selectorLabels" . | nindent 4 }}

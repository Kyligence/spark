apiVersion: v1
kind: Service
metadata:
  name: yinglong-frontend-service-{{ .Release.Namespace }}
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  selector:
    app: yinglong-frontend-{{ .Release.Namespace }}
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
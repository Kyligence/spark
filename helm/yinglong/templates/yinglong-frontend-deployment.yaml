apiVersion: apps/v1
kind: Deployment
metadata:
  name: yinglong-frontend-{{ .Release.Name }}
  labels:
    {{- include "yinglong.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "yinglong.selectorLabels" . | nindent 6 }}
      app: yinglong-frontend-{{ .Release.Name }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "yinglong.selectorLabels" . | nindent 8 }}
        app: yinglong-frontend-{{ .Release.Name }}
    spec:
      volumes:
        - name: default-conf
          configMap:
            name: yinglong-frontend-nginx-default-conf-{{ .Release.Name }}
            defaultMode: 420
      containers:
        - name: yinglong-frontend
          image: repo-ofs.kyligence.tech:5000/kyligence/yinglong-frontend:4.5.10-dev
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            limits:
              cpu: '1'
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: default-conf
              mountPath: /etc/nginx/conf.d/
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  minReadySeconds: 30
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
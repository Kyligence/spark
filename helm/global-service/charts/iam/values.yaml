# Default values for iam.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: registry.kyligence.io/xuanwu/iam-server
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "5.0.3"

frontend:
  replicaCount: 1
  image:
    repository: registry.kyligence.io/xuanwu/iam-frontend
    pullPolicy: Always
    tag: "5.0.2"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "saas-kyiam"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "saas-kyiam-serviceaccount"

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: NodePort
  port: 80

ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: iam.xuanwudev.kyligence.io
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 1000m
    memory: 2048Mi
  requests:
    cpu: 500m
    memory: 1024Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

config:
  mysql:
    host: mysql-svc.xuanwu-depend.svc.cluster.local
    port: 3306
    db: saas-kyiam
  db:
    driverClassName: com.mysql.cj.jdbc.Driver
    # url: jdbc:mysql://mysql-svc.xuanwu-depend.svc.cluster.local:3306/saas-kyiam?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: root
    password: kyligence

nacos:
  discovery:
    group: xuanwu-system
    publicGroup: xuanwu-system
    serverAddr: nacos-naming-svc.global-service.svc.cluster.local:8848
  config:
    serverAddr: nacos-config-svc.global-service.svc.cluster.local:8848

gateway:
  serverAddr: saas-gateway.global-service.svc.cluster.local:8080

kyligence:
  webhook: https://open.feishu.cn/open-apis/bot/v2/hook/5e44cc62-39a9-4fac-ba91-a0717d1a9803
  sync: false
  deployMode: KA
  request:
    domain: xuanwudev.kyligence.io

skyWalking:
  enabled: false
  serverAddr: skywalking-oap.sk:11800
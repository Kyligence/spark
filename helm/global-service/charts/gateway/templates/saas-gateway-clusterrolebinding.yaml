apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: manager-rolebinding-{{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: saas-gateway-clusterrole-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: saas-gateway-serviceaccount
    namespace: {{ .Release.Namespace }}

apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "kyligence-enterprise.fullname" . }}-nfs-share-pv-{{ .Release.Namespace }}
spec:
  capacity:
    storage: 20Gi
  nfs:
    server: 10.1.9.11
    path: /data/jenkins-common
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kyligence-enterprise.fullname" . }}-nfs-share-pvc
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Gi
  volumeName: {{ include "kyligence-enterprise.fullname" . }}-nfs-share-pv-{{ .Release.Namespace }}
  volumeMode: Filesystem
  storageClassName: ""


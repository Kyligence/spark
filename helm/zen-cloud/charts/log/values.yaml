fullnameOverride: "log"
backupSecret:
  accessKey: "FAKE"
  accessKeyID: "FAKE"
imagePullSecrets: docker-secret
api:
  api:
    image:
      registry:
      repository: xuanwu-log-api
      tag:
      imagePullPolicy:
    resources:
      limits:
        cpu: "1"
        memory: 128Mi
      requests:
        cpu: "1"
        memory: 128Mi
apiConfig:
  configYaml:
    data:
      loki:
        address: http://zen-cloud-loki-distributed-querier.zen-cloud:3100
    server:
      port: :8080
      workingDir: /var/log/log
apiService:
  ports:
    - port: 80
      protocol: TCP
      targetPort: 8080
  type: ClusterIP
backup:
  backup:
    image:
      registry:
      repository: xuanwu-log-scheduler
      tag:
      imagePullPolicy: Always
backupConfig:
  configYaml:
    archive:
      namePattern: '%s.log'
      s3:
        bucket: bucket_name
        region: region
      type: zip
      workingDir: /var/log/log
    data:
      loki:
        address: http://zen-cloud-loki-distributed-querier.zen-cloud:3100

kubernetesClusterDomain: cluster.local

loki-distributed:
  imagePullSecrets:
    - name: docker-secret
  global:
    # -- configures DNS service name
    # this is dns service name in kubernetes, maybe: coredns,core-dns,kubedns,kube-dns,need replace in customer's environment
    dnsService: kube-dns
    # -- configures DNS service namespace
    dnsNamespace: "kube-system"
  gateway:
    image:
      # -- The Docker registry for the gateway image
      registry: harbor-ofs.kyligence.com/yinglong
      # -- The gateway image repository
      repository: nginx-unprivileged
      # -- The gateway image tag
      tag:
      # -- The gateway image pull policy
      pullPolicy: Always
  loki:
    image:
      # -- The Docker registry
      registry: harbor-ofs.kyligence.com/yinglong
      # -- Docker image repository
      repository: loki
      # -- Overrides the image tag whose default is the chart's appVersion
      tag: v0.1.20221031
      # -- Docker image pull policy
      pullPolicy: Always

    config: |
      auth_enabled: false

      server:
        http_listen_port: 3100

      distributor:
        ring:
          kvstore:
            store: memberlist

      memberlist:
        join_members:
          - {{ include "loki.fullname" . }}-memberlist

      ingester:
        lifecycler:
          ring:
            kvstore:
              store: memberlist
            replication_factor: 1
        chunk_idle_period: 30m
        chunk_block_size: 262144
        chunk_encoding: snappy
        chunk_retain_period: 1m
        max_transfer_retries: 0
        wal:
          dir: /var/loki/wal

      limits_config:
        enforce_metric_name: false
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        max_cache_freshness_per_query: 10m
        split_queries_by_interval: 15m

      {{- if .Values.loki.schemaConfig}}
      schema_config:
      {{- toYaml .Values.loki.schemaConfig | nindent 2}}
      {{- end}}
      {{- if .Values.loki.storageConfig}}
      storage_config:
      {{- if .Values.indexGateway.enabled}}
      {{- $indexGatewayClient := dict "server_address" (printf "dns:///%s:9095" (include "loki.indexGatewayFullname" .)) }}
      {{- $_ := set .Values.loki.storageConfig.boltdb_shipper "index_gateway_client" $indexGatewayClient }}
      {{- end}}
      {{- toYaml .Values.loki.storageConfig | nindent 2}}
      {{- end}}

      chunk_store_config:
        max_look_back_period: 0s

      table_manager:
        retention_deletes_enabled: false
        retention_period: 0s

      query_range:
        align_queries_with_step: true
        max_retries: 5
        cache_results: false
        results_cache:
          cache:
            enable_fifocache: true
            fifocache:
              max_size_items: 1024

      frontend_worker:
        {{- if .Values.queryScheduler.enabled }}
        scheduler_address: {{ include "loki.querySchedulerFullname" . }}:9095
        {{- else }}
        frontend_address: {{ include "loki.queryFrontendFullname" . }}:9095
        {{- end }}

      frontend:
        log_queries_longer_than: 5s
        compress_responses: true
        {{- if .Values.queryScheduler.enabled }}
        scheduler_address: {{ include "loki.querySchedulerFullname" . }}:9095
        {{- end }}
        tail_proxy_url: http://{{ include "loki.querierFullname" . }}:3100

      compactor:
        shared_store: filesystem

      ruler:
        storage:
          type: local
          local:
            directory: /etc/loki/rules
        ring:
          kvstore:
            store: memberlist
        rule_path: /tmp/loki/scratch
        alertmanager_url: https://alertmanager.xx
        external_url: https://alertmanager.xx

    # -- Check https://grafana.com/docs/loki/latest/configuration/#schema_config for more info on how to configure schemas
    schemaConfig:
      configs:
        - from: 2020-09-07
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: loki_index_
            period: 24h

    # -- Check https://grafana.com/docs/loki/latest/configuration/#storage_config for more info on how to configure storages
    storageConfig:
      boltdb_shipper:
        shared_store: filesystem
        active_index_directory: /var/loki/index
        cache_location: /var/loki/cache
        cache_ttl: 168h
      filesystem:
        directory: /var/loki/chunks

fluent-bit:
  loki:
    # Please remember to change {{ printf "%s-loki-distributed-gateway" .Release.Name }}
    serviceName: zen-cloud-loki-distributed-gateway
    servicePort: 80
    servicePath: /loki/api/v1/push
  config:
    removeKeys:
      - kubernetes
      - stream
      - ecs.version
      - category
    labelMap:
      kubernetes:
        namespace_name: namespace
        labels:
          app: app
          release: release
          spark-app-selector: spark_app_id
        host: node
        container_name: container
        pod_name: instance
      category: category
      stream: stream
  image:
    repository: fluent-bit-plugin-loki
    tag:
    pullPolicy:
    ## Optionally specify an array of imagePullSecrets.
    ## Secrets must be present in the namespace.
    ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
    pullSecrets:
      - docker-secret

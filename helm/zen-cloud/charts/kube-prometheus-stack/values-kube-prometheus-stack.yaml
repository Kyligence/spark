prometheus:
  service:
    type: NodePort
    nodePort: 30091
  prometheusSpec:
    image:
      repository: quay.io/prometheus/prometheus
      tag: v2.38.0

    enableRemoteWriteReceiver: true
    podAntiAffinity: "hard"

    ## If anti-affinity is enabled sets the topologyKey to use for anti-affinity.
    ## This can be changed to, for example, failure-domain.beta.kubernetes.io/zone
    ##
    podAntiAffinityTopologyKey: kubernetes.io/hostname
    remoteWrite: 
    - url: http://kube-prometheus-thanos-receive.monitor.svc.cluster.local:19291/api/v1/receive

    containers: 
    - name: prometheus
      args:
        - "--web.console.templates=/etc/prometheus/consoles"
        - "--web.console.libraries=/etc/prometheus/console_libraries"
        - "--config.file=/etc/prometheus/config_out/prometheus.env.yaml"
        - "--web.enable-remote-write-receiver"
        - "--storage.tsdb.path=/prometheus"
        - "--web.enable-lifecycle"
        - "--storage.tsdb.no-lockfile"
        - "--web.enable-admin-api"
        - "--web.route-prefix=/"
        - "--web.config.file=/etc/prometheus/web_config/web-config.yaml"
        - "--storage.tsdb.min-block-duration=1h"
        - "--storage.tsdb.max-block-duration=1h"
        - "--storage.tsdb.retention.size=2048MB"
        - "--storage.tsdb.retention.time=1h"      
    storageSpec: 
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          resources:
            requests:
              storage: 20Gi    
    additionalScrapeConfigs: 
    - job_name: 'spark-pods-jmx'
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_jmx_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_jmx_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_jmx_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name     
    - job_name: 'spark-driver-executors-pods'
      kubernetes_sd_configs:
      - role: pod
      metrics_path: /metrics/executors/prometheus
      scrape_interval: 15s
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_executors_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_executors_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_executors_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name     
      metric_relabel_configs:
      - source_labels: [ __name__ ]
        target_label: __name__
        regex: metrics_application_[0-9]+_[0-9]+_(.+)
        replacement: spark_$1
      - source_labels: [ __name__ ]
        target_label: __name__
        regex: metrics_(.+)
        replacement: spark_$1  
          
thanos:
  enabled: true
  alertmanagerSpec:
    image:
      repository: quay.io/prometheus/alertmanager
      tag: v0.24.0
      sha: ""  
  image:
    registry: docker.io
    repository: bitnami/thanos
    tag: 0.28.0-scratch-r0

  queryFrontend:
    enabled: true 
    service: 
      type: NodePort

  query: 
   dnsDiscovery:
    sidecarsService: kube-prometheus-prometheus-thanos
    sidecarsNamespace: monitoring  

  bucketweb:
    enabled: true
    service: 
      type: NodePort    

  compactor:
    enabled: true
    persistence: 
      enabled: true
      storageClass: gp2
      accessModes: 
        - ReadWriteOnce
      size: 20Gi

  storegateway:
    enabled: true
    extraFlags:
      - --sync-block-duration=3m
      - --chunk-pool-size=1GB    
    persistence: 
      enabled: true
      storageClass: gp2
      accessModes: 
        - ReadWriteOnce
      size: 20Gi



  receive:
    enabled: true
    service: 
      additionalHeadless: true
    mode: dual-mode
    replicationFactor: 1
    replicaCount: 1
    persistence: 
      enabled: true
      storageClass: gp2
      accessModes: 
        - ReadWriteOnce
      size: 20Gi

  receiveDistributor:
    enabled: true

  minio:
    enabled: true 
    image:
      registry: docker.io
      repository: bitnami/minio
      tag: 2022.8.22-debian-11-r0
    service: 
      type: NodePort
    persistence: 
      enabled: true
      storageClass: gp2
      accessModes: 
        - ReadWriteOnce
      size: 20Gi
    auth: 
      rootPassword: admin123
  
  
  objstoreConfig: |-
    type: s3
    config:
      bucket: thanos
      endpoint: {{ .Release.Name }}-minio.{{ .Release.Namespace }}.svc.cluster.local:9000
      access_key: admin
      secret_key: admin123
      insecure: true                


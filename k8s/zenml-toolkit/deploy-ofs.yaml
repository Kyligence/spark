apiVersion: v1
kind: Namespace
metadata:
  name: zenml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zenml-toolkit-pvc
  namespace: zenml
  labels:
    app: zenml-toolkit-pvc
spec:
  storageClassName: local-path
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # selector:
  #   matchLabels:
  #     pv: zenml-toolkit-pv
# ---
# apiVersion: v1
# kind: PersistentVolume
# metadata:

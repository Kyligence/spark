apiVersion: v1
kind: ServiceAccount
metadata:
  name: cicd-jenkins-sa
  namespace: cicd

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cicd-jenkins-crb
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: cicd-jenkins-sa
  namespace: cicd


apiVersion: v1
kind: PersistentVolume
metadata:
  name: jenkins-home
  namespace: cicd
spec:
  capacity:
    storage: 1024Gi
  accessModes:
    - ReadWriteMany
  cephfs:
    monitors:
    - 10.1.9.101:6789
    - 10.1.9.102:6789
    - 10.1.9.103:6789
    path: /cicd/jenkins-home
    user: admin
    secretRef:
      name: ceph-secret

apiVersion: v1
kind: PersistentVolume
metadata:
  name: nginx
  namespace: cicd
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteMany
  cephfs:
    monitors:
      - 10.1.9.101:6789/jenkins_common
      - 10.1.9.102:6789/jenkins_common
      - 10.1.9.103:6789/jenkins_common
    user: admin
    secretRef:
      name: ceph-secret
    readOnly: false
  persistentVolumeReclaimPolicy: Retain

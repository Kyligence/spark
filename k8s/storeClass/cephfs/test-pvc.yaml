kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: ceph-pvc-test1
  namespace: cephfs
spec:
  storageClassName: cephfs-dynamic
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Mi
---
kind: Pod
apiVersion: v1
metadata:
  name: test-pod-1
  namespace: cephfs
spec:
  containers:
  - name: test-pod-1
    image: hub.leffss.com/library/busybox:v1.29.2
    resources:
      requests:
        memory: "32Mi"
        cpu: "500m"
      limits:
        memory: "64Mi"
        cpu: "500m"
    command:
      - "/bin/sh"
    args:
      - "-c"
      - "touch /mnt/SUCCESS-ceph-pvc-test1 && exit 0 || exit 1"
    volumeMounts:
      - name: pvc
        mountPath: "/mnt"
  restartPolicy: "Never"
  volumes:
    - name: pvc
      persistentVolumeClaim:
        claimName: ceph-pvc-test1

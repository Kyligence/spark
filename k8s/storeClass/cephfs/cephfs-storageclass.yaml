kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: cephfs-dynamic
provisioner: ceph.com/cephfs
parameters:
    monitors: 10.1.3.4:6789,10.1.3.5:6789,10.1.3.6:6789
    adminId: admin
    adminSecretName: cephfs-secret
    adminSecretNamespace: "kube-system"
    claimRoot: /volumes/kubernetes
kind: Pod
apiVersion: v1
metadata:
  name: test-pod-local
  namespace: ops
spec:
  containers:
  - name: test-pod-local
    image: busybox:1.24
    resources:
      limits:
        cpu: "500m"
        memory: "64Mi"
    command:
      - "/bin/sh"
    args:
      - "-c"
      - "touch /mnt/SUCCESS && exit 0 || exit 1"   #创建一个SUCCESS文件后退出
    volumeMounts:
      - name: local-pvc
        mountPath: "/mnt"
  restartPolicy: "Never"
  volumes:
    - name: local-pvc
      persistentVolumeClaim:
        claimName: test-claim-local  #与PVC名称保持一致
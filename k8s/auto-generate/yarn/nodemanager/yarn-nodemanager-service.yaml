apiVersion: v1
kind: Service
metadata:
  name: yarn-nodemanager
  namespace: <<<namespace>>>
  labels:
    metrics-exporter: prometheus
spec:
  clusterIP: None
  ports:
    - name: "8402"
      port: 8402
      targetPort: 8402
    - port: 8080
      name: metrics
  selector:
    io.kompose.service: yarn-nodemanager

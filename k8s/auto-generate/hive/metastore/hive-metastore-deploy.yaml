apiVersion: v1
kind: Service
metadata:
  namespace: <<<namespace>>>
  name: hive-metastore
spec:
  selector:
    app: hive-metastore
  ports:
    - port: 9083
      name: thrift
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: <<<namespace>>>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive-metastore
  template:
    metadata:
      labels:
        app: hive-metastore
    spec:
      imagePullSecrets:
      - name: docker-registry-secret
      containers:
      - name: hive-metastore
        image: 10.1.9.11:31500/hive:1.2.2-hadoop-2.10.1
        ports:
        - containerPort: 9083
          name: thrift
        volumeMounts:
        - name: config
          mountPath: /opt/apache-hive-1.2.2-bin/conf/hive-site.xml
          subPath: hive-site.xml
        - name: config
          mountPath: /opt/hadoop-2.10.1/etc/hadoop/core-site.xml
          subPath: core-site.xml
        command: ["/opt/apache-hive-1.2.2-bin/bin/hive"]
        args: ["--service", "metastore"]
        resources:
          requests:
            memory: 1Gi
            cpu: 1
        env:
        - name: HADOOP_HEAPSIZE
          value: "1024"
        - name: FORMAT_MESSAGES_PATTERN_DISABLE_LOOKUPS
          value: "true"
        imagePullPolicy: Always
        livenessProbe:
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          tcpSocket:
            port: thrift
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 2
          timeoutSeconds: 1
          tcpSocket:
            port: thrift
      volumes:
        - name: config
          configMap:
            name: yarn-xml
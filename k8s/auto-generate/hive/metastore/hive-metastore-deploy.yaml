apiVersion: v1
kind: Service
metadata:
  namespace: <<<namespace>>>
  name: hive-metastore
  labels:
    metrics-exporter: prometheus
spec:
  selector:
    app: hive-metastore
  ports:
    - port: 9083
      name: thrift
    - port: 8080
      name: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
  namespace: <<<namespace>>>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive-metastore
  template:
    metadata:
      labels:
        app: hive-metastore
    spec:
      imagePullSecrets:
      - name: docker-registry-secret
      initContainers:
      - name: jmx-exporter
        image: 10.1.9.11:31500/jmx-prometheus-javaagent:0.16.1
        volumeMounts:
        - name: exporter-dir
          mountPath: /opt/jmx-exporter/
        command: ["cp", "/opt/jmx_prometheus_javaagent-0.16.1.jar", "/opt/jmx-exporter/"]
      containers:
      - name: hive-metastore
        image: 10.1.9.11:31500/hive:1.2.2-hadoop-2.10.1
        ports:
        - containerPort: 9083
          name: thrift
        volumeMounts:
        - name: config
          mountPath: /opt/apache-hive-1.2.2-bin/conf/hive-site.xml
          subPath: hive-site.xml
        - name: config
          mountPath: /opt/hadoop-2.10.1/etc/hadoop/core-site.xml
          subPath: core-site.xml
        - name: exporter-dir
          mountPath: /opt/jmx-exporter/
        - name: jmx-config
          mountPath: /opt/jmx-exporter/config.yaml
          subPath: config.yaml
        command: ["/opt/apache-hive-1.2.2-bin/bin/hive"]
        args: ["--service", "metastore"]
        resources:
          requests:
            memory: 1Gi
            cpu: 1
        env:
        - name: HADOOP_HEAPSIZE
          value: "1024"
        - name: FORMAT_MESSAGES_PATTERN_DISABLE_LOOKUPS
          value: "true"
        - name: HADOOP_OPTS
          value: -javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent-0.16.1.jar=8080:/opt/jmx-exporter/config.yaml
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          tcpSocket:
            port: thrift
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 2
          timeoutSeconds: 1
          tcpSocket:
            port: thrift
      volumes:
        - name: config
          configMap:
            name: yarn-xml
        - name: exporter-dir
          emptyDir: {}
        - name: jmx-config
          configMap:
            name: jmx-exporter-config
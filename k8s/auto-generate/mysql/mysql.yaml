# docker pull mysql:5.7

# echo -n 'kyligence' | base64

apiVersion: v1
kind: Secret
metadata:
  namespace: <<<namespace>>>
  name: mysql
type: Opaque
data:
  password: a3lsaWdlbmNl
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: <<<namespace>>>
  name: mysql
  labels:
    app: mysql
data:
  mysql.cnf: |
    [mysqld]
    innodb_buffer_pool_size = 2GB
    innodb_buffer_pool_instances = 1

    innodb_flush_log_at_trx_commit = 1
    sync_binlog = 1
    max_connections = 200
    innodb_log_file_size = 500MB
    innodb_log_files_in_group = 2
    server_id = 1000
    log_bin = BIN-LOG
    binlog_format = ROW
    innodb_io_capacity = 200

    character_set_client_handshake=FALSE
    character_set_server=utf8mb4
    init_connect='SET NAMES utf8mb4'
    init_connect='SET collation_connection = utf8mb4_unicode_ci'
    collation_server=utf8mb4_unicode_ci

    [client]
    default_character_set=utf8mb4

    [mysql]
    default_character_set=utf8mb4
  mysql-init.sql: |
    CREATE DATABASE hive DEFAULT CHARACTER SET utf8 DEFAULT COLLATE utf8_general_ci;
    create user 'hive'@'%' identified by 'hive';
    grant all on hive.* to 'hive'@'%';

    flush privileges;
---
apiVersion: v1
kind: Service
metadata:
  namespace: <<<namespace>>>
  name: mysql
  labels:
    app: mysql
spec:
  ports:
  - name: mysql
    port: 3306
  - name: metrics
    port: 9104
  selector:
    app: mysql
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: <<<namespace>>>
  name: mysql-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: <<<namespace>>>
  name: mysql
spec:
  selector:
    matchLabels:
      app: mysql
  replicas: 1
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:5.7
        imagePullPolicy: IfNotPresent
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql
              key: password
        ports:
        - name: mysql
          containerPort: 3306
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        - name: config
          mountPath: /etc/mysql/conf.d/mysql.cnf
          subPath: mysql.cnf
        - name: config
          mountPath: /docker-entrypoint-initdb.d/mysql-init.sql
          subPath: mysql-init.sql
        livenessProbe:
          exec:
            command:
              - /bin/bash
              - '-ec'
              - |
                mysqladmin status -uroot -p${MYSQL_ROOT_PASSWORD}
          initialDelaySeconds: 30
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 20
        readinessProbe:
          exec:
            command:
              - /bin/bash
              - '-ec'
              - |
                mysqladmin status -uroot -p${MYSQL_ROOT_PASSWORD}
          initialDelaySeconds: 30
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 20
      - name: mysql-prometheus-exporter
        image: prom/mysqld-exporter:v0.13.0
        ports:
        - containerPort: 9104
          name: metrics
        livenessProbe:
          initialDelaySeconds: 5
          periodSeconds: 10
          httpGet:
            path: /metrics
            port: metrics
        readinessProbe:
          initialDelaySeconds: 5
          periodSeconds: 10
          httpGet:
            path: /metrics
            port: metrics
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql
              key: password
        - name: DATA_SOURCE_NAME
          value: root:$(MYSQL_ROOT_PASSWORD)@(localhost:3306)/
      volumes:
      - name: config
        configMap:
          name: mysql
      - name: data
        persistentVolumeClaim:
          claimName: mysql-pvc

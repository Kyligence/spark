kind: Deployment
apiVersion: apps/v1
metadata:
  name: nexus3-new
  namespace: cicd
  labels:
    app: nexus3
  annotations:
    deployment.kubernetes.io/revision: '1'
    kubectl.kubernetes.io/last-applied-configuration: >
      {"apiVersion":"apps/v1","kind":"Deployment","metadata":{"annotations":{"deployment.kubernetes.io/revision":"3","kubesphere.io/creator":"admin"},"labels":{"app":"nexus3"},"name":"nexus3-new","namespace":"cicd"},"spec":{"progressDeadlineSeconds":600,"replicas":1,"revisionHistoryLimit":10,"selector":{"matchLabels":{"app":"nexus3"}},"strategy":{"type":"Recreate"},"template":{"metadata":{"annotations":{"kubesphere.io/restartedAt":"2023-03-08T17:07:00.960Z","logging.kubesphere.io/logsidecar-config":"{}"},"creationTimestamp":null,"labels":{"app":"nexus3","pod-template-hash":"846c84c455"}},"spec":{"containers":[{"image":"sonatype/nexus3:3.37.3","imagePullPolicy":"IfNotPresent","livenessProbe":{"failureThreshold":6,"httpGet":{"path":"/","port":8081,"scheme":"HTTP"},"initialDelaySeconds":1000,"periodSeconds":30,"successThreshold":1,"timeoutSeconds":60},"name":"nexus3","ports":[{"containerPort":8081,"name":"web","protocol":"TCP"},{"containerPort":5000,"name":"http-5000","protocol":"TCP"}],"resources":{"limits":{"cpu":"4","memory":"8048Mi"},"requests":{"cpu":"4","memory":"8048Mi"}},"securityContext":{"privileged":false,"runAsNonRoot":false,"runAsUser":0},"terminationMessagePath":"/dev/termination-log","terminationMessagePolicy":"File","volumeMounts":[{"mountPath":"/nexus-data","name":"nexus-data"}]}],"dnsPolicy":"ClusterFirst","nodeSelector":{"cicd":""},"restartPolicy":"Always","schedulerName":"default-scheduler","securityContext":{},"terminationGracePeriodSeconds":30,"tolerations":[{"effect":"NoSchedule","key":"cicd","operator":"Equal"}],"volumes":[{"name":"nexus-data","persistentVolumeClaim":{"claimName":"nexus-pvc"}}]}}}}
    kubesphere.io/creator: admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus3
  template:
    metadata:
      labels:
        app: nexus3
    spec:
      volumes:
        - name: nexus-data
          persistentVolumeClaim:
            claimName: nexus-pvc
        - name: nexus-vmoptions
          configMap:
            defaultMode: 0777
            items:
              - key: "nexus.vmoptions"
                path: "nexus.vmoptions"
            name: nexus-vmoptions
      containers:
        - name: nexus3
          image: 'sonatype/nexus3:3.37.3'
          ports:
            - name: web
              containerPort: 8081
              protocol: TCP
            - name: http-5000
              containerPort: 5000
              protocol: TCP
          resources:
            limits:
              cpu: '8'
              memory: 16Gi
            requests:
              cpu: '4'
              memory: 8Gi
          volumeMounts:
            - name: nexus-data
              mountPath: /nexus-data
            - name: nexus-vmoptions
              mountPath: /opt/sonatype/nexus/bin/nexus.vmoptions
              subPath: nexus.vmoptions
              readOnly: false
          livenessProbe:
            httpGet:
              path: /
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 1000
            timeoutSeconds: 60
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 6
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: false
            runAsUser: 0
            runAsNonRoot: false
      restartPolicy: Always
      nodeSelector:
        cicd: ''
      securityContext: {}
      schedulerName: default-scheduler
      tolerations:
        - key: cicd
          operator: Equal
          effect: NoSchedule
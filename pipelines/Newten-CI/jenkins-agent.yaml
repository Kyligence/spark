---
kind: "Pod"
name: "jenkins-agent"
spec:
  containers:
    - volumeMounts:
        - mountPath: "/root/.m2"
          name: "jenkins-common"
          subPath: "maven3"
        - mountPath: "/var/troubleshooting"
          name: "jenkins-common"
          subPath: "troubleshooting"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-8"
      name: "maven"
    - volumeMounts:
        - mountPath: "/var/jenkins_common"
          name: "jenkins-common"
          subPath: null
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
      tty: true
      command:
        - "cat"
      image: "bitnami/git:latest"
      name: "git"
    - volumeMounts:
        - mountPath: "/root/.m2"
          name: "jenkins-common"
          subPath: "maven3"
        - mountPath: "/var/troubleshooting"
          name: "jenkins-common"
          subPath: "troubleshooting"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-8"
      name: "utest-stage-1"
    - volumeMounts:
        - mountPath: "/root/.m2"
          name: "jenkins-common"
          subPath: "maven3"
        - mountPath: "/var/troubleshooting"
          name: "jenkins-common"
          subPath: "troubleshooting"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-8"
      name: "utest-stage-2"
    - volumeMounts:
        - mountPath: "/root/.m2"
          name: "jenkins-common"
          subPath: "maven3"
        - mountPath: "/var/troubleshooting"
          name: "jenkins-common"
          subPath: "troubleshooting"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-8"
      name: "utest-stage-3"
    - volumeMounts:
        - mountPath: "/root/.m2"
          name: "jenkins-common"
          subPath: "maven3"
        - mountPath: "/var/troubleshooting"
          name: "jenkins-common"
          subPath: "troubleshooting"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-8"
      name: "utest-stage-4"
    - volumeMounts:
        - mountPath: "/root/.m2"
          name: "jenkins-common"
          subPath: "maven3"
        - mountPath: "/var/troubleshooting"
          name: "jenkins-common"
          subPath: "troubleshooting"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-8"
      name: "itest-stage-1"
    - volumeMounts:
        - mountPath: "/root/.m2"
          name: "jenkins-common"
          subPath: "maven3"
        - mountPath: "/var/troubleshooting"
          name: "jenkins-common"
          subPath: "troubleshooting"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-8"
      name: "itest-stage-2"
  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-common"
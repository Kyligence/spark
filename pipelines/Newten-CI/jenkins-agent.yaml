---
kind: "Pod"
name: "jenkins-agent"
spec:
  containers:
    - name: "maven"
      tty: true
      command:
        - "cat"
      image: "docker.ops.kylincorp.com/maven:3.8.3-openjdk-8-repo"
      imagePullPolicy: "Always"
    - volumeMounts:
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
      tty: true
      command:
        - "cat"
      image: "bitnami/git:latest"

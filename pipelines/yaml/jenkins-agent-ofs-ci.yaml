---
kind: "Pod"
name: "jenkins-agent"
spec:
  tolerations:
  - key: "nodetype"
    operator: "Equal"
    value: "ke"
    effect: "NoSchedule"
  containers:
    - name: "git"
      image: "bitnami/git:2.35.1-debian-10-r68"
      imagePullPolicy: "IfNotPresent"
      tty: true
      command:
        - "cat"
      volumeMounts:
        - name: "kyligence-repo"
          mountPath: /root/.m2/repository
          readOnly: false

    - name: "maven"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-8"
      imagePullPolicy: "IfNotPresent"
      volumeMounts:
        - mountPath: "/root/.m2"
          name: "jenkins-common"
          subPath: "maven3"
        - name: "kyligence-repo"
          mountPath: /root/.m2/repository/io/kyligence
          readOnly: false
        - mountPath: "/root/.m2/settings.xml"
          name: "lex-mvn-settings"
          readOnly: false
          subPath: "settings.xml"
        - mountPath: "/var/run/docker.sock"
          name: "dockersock"

    - name: "sonar-cloud"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-11"
      imagePullPolicy: "IfNotPresent"
      env:
        - name: HTTP_PROXY
          value: null
        - name: HTTPS_PROXY
          value: null
      volumeMounts:
        - name: "kyligence-repo"
          mountPath: /root/.m2/repository/io/kyligence
          readOnly: false
        - mountPath: "/root/.m2/settings.xml"
          name: "lex-mvn-settings"
          readOnly: false
          subPath: "settings.xml"

  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-common"
    - name: "kyligence-repo"
      emptyDir: { }
    - configMap:
        defaultMode: 0777
        items:
          - key: "settings.xml"
            path: "settings.xml"
        name: "lex-mvn-settings"
      name: "lex-mvn-settings"
    - name: "dockersock"
      hostPath:
        path: "/var/run/docker.sock"

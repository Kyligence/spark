---
kind: "Pod"
name: "jenkins-package-agent"
spec:
  containers:
    - name: "build"
      image: "harbor-ofs.kyligence.com/library/newten-build:1.0"
      imagePullPolicy: "IfNotPresent"
      tty: true
      command:
        - "cat"
      resources:
        request:
          memory: "2Gi"
          cpu: "100m"
        limits:
          memory: "8Gi"
          cpu: "4000m"
      volumeMounts:
        - mountPath: "/root/.m2"
          name: "jenkins-common"
          subPath: "maven3"
        - mountPath: "/root/.m2/settings.xml"
          name: "lex-mvn-settings"
          readOnly: false
          subPath: "settings.xml"
        - name: "kyligence-repo"
          mountPath: /root/.m2/repository/io/kyligence
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
    - name: "docker"
      tty: true
      command:
        - "cat"
      image: "harbor-ofs.kyligence.com/library/docker:1.0"
      imagePullPolicy: "Always"
      volumeMounts:
        - mountPath: "/var/run/docker.sock"
          name: "dockersock"
        - mountPath: "/root/.docker/config.json"
          name: "docker-config"
        - mountPath: "/etc/docker/daemon.json"
          name: "lex-docker"
          subPath: "daemon.json"
      resources:
        request:
          memory: "1Gi"
          cpu: "100m"
        limits:
          memory: "2Gi"
          cpu: "500m"
    - name: "kubectl"
      image: "cnych/kubectl"
      imagePullPolicy: "IfNotPresent"
      tty: true
      command:
        - "cat"
      resources:
        request:
          cpu: "100m"
          memory: "500Mi"
        limits:
          cpu: "300m"
          memory: "1Gi"
      volumeMounts:
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
    - name: "helm"
      image: "lachlanevenson/k8s-helm:v3.1.1"
      imagePullPolicy: "IfNotPresent"
      tty: true
      command:
        - "cat"
      resources:
        request:
          cpu: "100m"
          memory: "500Mi"
        limits:
          cpu: "300m"
          memory: "1Gi"
      volumeMounts:
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-common"
    - name: "kyligence-repo"
      emptyDir: { }
    - name:  "kube-config"
      hostPath:
        path:  "/home/jenkins/.kube"
    - configMap:
        defaultMode: 0777
        items:
          - key: "settings.xml"
            path: "settings.xml"
        name: "lex-mvn-settings"
      name: "lex-mvn-settings"
    - configMap:
        items:
          - key: "daemon.json"
            path: "daemon.json"
          - key: "config.json"
            path: "config.json"
        name: "lex-docker"
      name: "lex-docker"
    - name: "dockersock"
      hostPath:
        path: "/var/run/docker.sock"
    - name: "docker-config"
      hostPath:
        path: "/root/.docker/"
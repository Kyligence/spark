---
kind: "Pod"
name: "jenkins-k8s-agent"
spec:
  # nodeSelector:
  #   kubernetes.io/hostname: "kubernetes-work01"
  containers:
    - name: "busybox"
      image: "busybox"
      imagePullPolicy: "IfNotPresent"
      tty: true
      command:
        - "cat"
      resources:
        limits:
          memory: "2Gi"
          cpu: "2000m"
      volumeMounts:
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
    - name: "kubectl"
      image: "cnych/kubectl"
      imagePullPolicy: "IfNotPresent"
      tty: true
      command:
        - "cat"
      resources:
        limits:
          memory: "2Gi"
          cpu: "2000m"
      volumeMounts:
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
        - mountPath: "/root/.kube"
          name: "kube-config"
          subPath: "config"
  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-common"
    - name:  "kube-config"
      hostPath:
        path:  "/home/jenkins/.kube"

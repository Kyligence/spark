---
kind: "Pod"
name: "jenkins-package-agent"
spec:
  containers:
    - name: 'python3'
      image: "python:3.11.0-alpine3.16"
      imagePullPolicy: "IfNotPresent"
      tty: true
      command:
        - "cat"
      resources:
        requests:
          memory: "1Gi"
          cpu: "100m"
        limits:
          memory: "8Gi"
          cpu: "4000m"
      volumeMounts:
        - mountPath: "/mnt/jenkins"
          name: "quard-newten"
          subPath: ""
    - name: "build"
      image: "harbor-ofs.kyligence.com/library/newten-build:0.1"
      imagePullPolicy: "IfNotPresent"
      tty: true
      command:
        - "cat"
      resources:
        requests:
          memory: "1Gi"
          cpu: "100m"
        limits:
          memory: "8Gi"
          cpu: "4000m"
      volumeMounts:
        - mountPath: "/root/.m2"
          name: "jenkins-common"
          subPath: "maven3"
        - mountPath: "/root/.m2/settings.xml"
          name: "lex-mvn-settings"
          readOnly: false
          subPath: "settings.xml"
        - name: "kyligence-repo"
          mountPath: /root/.m2/repository/io/kyligence
        - name: "kylin-repo"
          mountPath: /root/.m2/repository/org/apache/kylin
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
    - name: "kubectl"
      image: "cnych/kubectl"
      imagePullPolicy: "IfNotPresent"
      tty: true
      command:
        - "cat"
      resources:
        requests:
          cpu: "100m"
          memory: "200Mi"
        limits:
          cpu: "300m"
          memory: "1024Mi"
      volumeMounts:
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
  nodeSelector:
    cicd: ''
  tolerations:
    - key: cicd
      operator: Equal
      effect: NoSchedule
  volumes:
    - name: "quard-newten"
      persistentVolumeClaim:
        claimName: "quard-pvc"
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-pvc-nfs"
    - name: "kyligence-repo"
      emptyDir: { }
    - name: "kylin-repo"
      emptyDir: { }
    - name:  "kube-config"
      hostPath:
        path:  "/home/jenkins/.kube"
    - configMap:
        defaultMode: 0777
        items:
          - key: "settings.xml"
            path: "settings.xml"
        name: "lex-mvn-settings"
      name: "lex-mvn-settings"

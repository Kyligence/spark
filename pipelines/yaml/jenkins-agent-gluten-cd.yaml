---
kind: "Pod"
name: "jenkins-agent"
spec:
  tolerations:
  - key: "nodetype"
    operator: "Equal"
    value: "ke"
    effect: "NoSchedule"
  containers:
    - name: "git"
      volumeMounts:
        - name: "kyligence-repo"
          mountPath: /clickhouse
          readOnly: false
      tty: true
      command:
        - "cat"
#        - "git submodule update --init --recursive"
      image: "bitnami/git:2.35.1-debian-10-r68"
      imagePullPolicy: "IfNotPresent"
      resources:
        limits:
          memory: "4Gi"
          cpu: "2000m"
        requests:
          memory: "2Gi"
          cpu: "800m"

    - name: "libchbuilder"
      tty: true
      command:
        - "cat"
      image: "457798666374.dkr.ecr.us-west-2.amazonaws.com/jenkinsslave/libchbuilder:0.1.0"
      imagePullPolicy: "IfNotPresent"
      env:
        - name: HTTP_PROXY
          value: null
        - name: HTTPS_PROXY
          value: null
        - name: ENABLE_EMBEDED_COMPILER
          value: ON
      volumeMounts:
        - mountPath: "/ccache"
          name: "jenkins-common"
          readOnly: false
          subPath: "ccache"
      resources:
        limits:
          memory: "30Gi"
          cpu: "16"
        requests:
          memory: "30Gi"
          cpu: "16"

  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-common"
    - name: "kyligence-repo"
      emptyDir: { }
    - name: "dockersock"
      hostPath:
        path: "/var/run/docker.sock"

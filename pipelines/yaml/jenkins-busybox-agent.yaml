---
kind: "Pod"
name: "jenkins-busybox-agent"
spec:
  # nodeSelector:
  #   kubernetes.io/hostname: "kubernetes-work01"
  containers:
    - name: "busybox"
      image: "busybox"
      imagePullPolicy: "IfNotPresent"
      tty: true
      command:
        - "cat"
      resources:
        limits:
          memory: "2Gi"
          cpu: "2000m"
      volumeMounts:
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-common"
    - name: "kyligence-repo"
      emptyDir: { }

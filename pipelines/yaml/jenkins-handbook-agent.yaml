---
kind: "Pod"
name: "handbook-agent"
spec:
  containers:
    - name: "git"
      image: "bitnami/git:2.35.1-debian-10-r68"
      volumeMounts:
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
      tty: true
      command:
        - "cat"
      resources:
        request:
          memory: "1Gi"
          cpu: "100m"
        limits:
          memory: "1Gi"
          cpu: "1000m"
    - name: "build"
      image: "repo-ofs.kyligence.com/handbook:1.12"
      imagePullPolicy: "IfNotPresent"
      tty: true
      command:
        - "cat"
      resources:
        request:
          memory: "1Gi"
          cpu: "100m"
        limits:
          memory: "8Gi"
          cpu: "4000m"
      volumeMounts:
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
        - mountPath: "/etc/pem/"
          name: "handbook-secret"
        # - mountPath: "/etc/pem/rsa.pem"
        #   name: "handbook-secret"
        #   subPath: "rsa.pem"
        - mountPath: "/usr/local/lib/node_modules"
          name: "jenkins-common"
          subPath: "handbook"
  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-common"
    - name: "handbook-secret"
      secret:
        secretName: "handbook-secret"
        defaultMode: 0400

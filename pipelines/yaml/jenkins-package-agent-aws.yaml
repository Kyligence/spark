---
kind: "Pod"
name: "jenkins-agent"
spec:
  containers:
    - image: "sunfuzhou/newten-build:latest"
      imagePullPolicy: "IfNotPresent"
      name: "build"
      tty: true
      command:
        - "cat"
      resources:
        request:
          memory: "4Gi"
          cpu: "1500m"
        limits:
          memory: "8Gi"
          cpu: "4000m"
      volumeMounts:
        - mountPath: "/root/.m2"
          name: "jenkins-common"
          subPath: "maven3"
        - name: "kyligence-repo"
          mountPath: /root/.m2/repository/io/kyligence
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
      
  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-common"
    - name: "kyligence-repo"
      emptyDir: { }

  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-pvc-nfs"
    - name: "kyligence-repo"
      emptyDir: { }
    - name: "kylin-repo"
      emptyDir: { }
    - name:  "kube-config"
      hostPath:
        path:  "/home/jenkins/.kube"
    - configMap:
        defaultMode: 0777
        items:
          - key: "settings.xml"
            path: "settings.xml"
          - key: "settings2.xml"
            path: "settings2.xml"
        name: "lex-mvn-settings"
      name: "lex-mvn-settings"

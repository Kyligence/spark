---
kind: "Pod"
name: "jenkins-package-agent"
spec:
  containers:
    - name: "build"
      image: "repo-ofs.kyligence.tech:5000/newten-build:latest"
      imagePullPolicy: "IfNotPresent"
      tty: true
      command:
        - "cat"
      # resources:
      #   request:
      #     memory: "2Gi"
      #     cpu: "100m"
      #   limits:
      #     memory: "8Gi"
      #     cpu: "2000m"
      volumeMounts:
        - mountPath: "/root/.m2"
          name: "jenkins-common"
          subPath: "maven3"
        - mountPath: "/root/.m2/settings.xml"
          name: "lex-mvn-settings"
          readOnly: false
          subPath: "settings.xml"
        - name: "kyligence-repo"
          mountPath: /root/.m2/repository/io/kyligence
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
    - name: "kubectl"
      image: "cnych/kubectl"
      imagePullPolicy: "IfNotPresent"
      tty: true
      command:
        - "cat"
      # resources:
      #   request:
      #     cpu: "100m"
      #     memory: "200Mi"
      #   limits:
      #     cpu: "300m"
      #     memory: "1024Mi"
      volumeMounts:
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-common"
    - name: "kyligence-repo"
      emptyDir: { }
    - name:  "kube-config"
      hostPath:
        path:  "/home/jenkins/.kube"
    - configMap:
        defaultMode: 0777
        items:
          - key: "settings.xml"
            path: "settings.xml"
        name: "lex-mvn-settings"
      name: "lex-mvn-settings"

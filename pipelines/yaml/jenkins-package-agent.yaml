---
kind: "Pod"
name: "jenkins-package-agent"
spec:
  nodeSelector:
    kubernetes.io/hostname: "kubernetes-work01"
  containers:
    - name: "build"
      image: "docker.ops.kylincorp.com/newten-build:latest"
      imagePullPolicy: "IfNotPresent"
      tty: true
      command:
        - "cat"
      resources:
        request:
          memory: "2000Mi"
          cpu: "500m"
        limits:
          memory: "4000Mi"
          cpu: "2000m"
      volumeMounts:
        - mountPath: "/root/.m2"
          name: "jenkins-common"
          subPath: "maven3"
        - mountPath: "/root/.m2/settings.xml"
          name: "lex-mvn-settings"
          readOnly: false
          subPath: "settings.xml"
        - name: "kyligence-repo"
          mountPath: /root/.m2/repository/io/kyligence
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
    - name: "kubectl"
      image: "cnych/kubectl"
      imagePullPolicy: "IfNotPresent"
      tty: true
      command:
        - "cat"
      resources:
        request:
          cpu: "300m"
          memory: "300Mi"
        limits:
          cpu: "750m"
          memory: "750m"
      volumeMounts:
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-common"
    - name: "kyligence-repo"
      emptyDir: { }
    - name:  "kube-config"
      hostPath:
        path:  "/home/jenkins/.kube"
    - configMap:
        defaultMode: 0777
        items:
          - key: "settings.xml"
            path: "settings.xml"
        name: "ke-maven-settings"
      name: "lex-mvn-settings"
    - configMap:
        defaultMode: 0777
        items:
          - key: "settings.xml"
            path: "settings.xml"
        name: "ke-npm-repo"
      name: "lex-npm-repo"

---
kind: "Pod"
name: "jenkins-agent"
spec:
  containers:
    - name: "maven"
      tty: true
      command:
        - "cat"
      image: "maven:3.6.3-openjdk-8"
      imagePullPolicy: "IfNotPresent"
      volumeMounts:
        - name: "jenkins-common"
          mountPath: /root/.m2/repository
          subPath: "maven_repo"
        - name: "kyligence-repo"
          mountPath: /root/.m2/repository/io/kyligence
        - name: "kylin-repo"
          mountPath: /root/.m2/repository/org/apache/kylin
        - mountPath: "/var/run/docker.sock"
          name: "dockersock"
        - mountPath: "/root/.m2/settings.xml"
          name: "maven-settings"
          readOnly: false
          subPath: "settings.xml"
      resources:
        requests:
          memory: "12Gi"
          cpu: "4"
    - name: "sonar"
      tty: true
      command:
        - "cat"
      image: "maven:3.6.3-openjdk-11"
      imagePullPolicy: "IfNotPresent"
      volumeMounts:
        - name: "jenkins-common"
          mountPath: /root/.m2/repository
          subPath: "maven_repo"
        - mountPath: "/root/.m2/settings.xml"
          name: "maven-settings"
          readOnly: false
          subPath: "settings.xml"
      resources:
        requests:
          memory: "4Gi"
          cpu: "2"
  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-common"
    - name: "kyligence-repo"
      emptyDir: { }
    - name: "kylin-repo"
      emptyDir: { }
    - name: "dockersock"
      hostPath:
        path: "/var/run/docker.sock"
    - configMap:
        defaultMode: 0777
        items:
          - key: "settings.xml"
            path: "settings.xml"
        name: "aws-maven-settings"
      name: "maven-settings"
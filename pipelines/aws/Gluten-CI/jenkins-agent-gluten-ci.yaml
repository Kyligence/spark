---
kind: "Pod"
name: "jenkins-agent"
metadata:
  namespace: node
spec:
  # tolerations:
  # - key: "nodetype"
  #   operator: "Equal"
  #   value: "ke"
  #   effect: "NoSchedule"
  containers:
    - name: "git"
      volumeMounts:
        - name: "kyligence-repo"
          mountPath: /clickhouse
          readOnly: false
        - mountPath: "/source-folder"
          name: "jenkins-common"
          readOnly: false
          subPath: "source-folder"
      tty: true
      command:
        - "cat"
#        - "git submodule update --init --recursive"
      image: "bitnami/git:2.35.1-debian-10-r68"
      imagePullPolicy: "IfNotPresent"
      resources:
        limits:
          memory: "2Gi"
          cpu: "2000m"
        requests:
          memory: "1Gi"
          cpu: "500m"

    - name: "maven"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-8"
      imagePullPolicy: "IfNotPresent"
      volumeMounts:
        - name: "kyligence-repo"
          mountPath: /jenkins-common/.kem2/repository
          readOnly: false
        - name: "tmpfs"
          mountPath: /tmp
          readOnly: false
        - mountPath: "/root/.m2/settings.xml"
          name: "maven-settings"
          readOnly: false
          subPath: "settings.xml"
        - mountPath: "/var/run/docker.sock"
          name: "dockersock"
        - mountPath: "/dataset"
          name: "jenkins-common"
          readOnly: true
          subPath: "dataset"
        - mountPath: "/maven-log"
          name: "jenkins-common"
          readOnly: false
          subPath: "maven-log"

      resources:
        limits:
          memory: "16Gi"
          cpu: "16"
        requests:
          memory: "4Gi"
          cpu: "2"

    - name: "maven2"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-8"
      imagePullPolicy: "IfNotPresent"
      volumeMounts:
        - name: "kyligence-repo"
          mountPath: /jenkins-common/.kem2/repository
          readOnly: false
        - name: "tmpfs"
          mountPath: /tmp
          readOnly: false
        - mountPath: "/root/.m2/settings.xml"
          name: "maven-settings"
          readOnly: false
          subPath: "settings.xml"
        - mountPath: "/var/run/docker.sock"
          name: "dockersock"
        - mountPath: "/dataset"
          name: "jenkins-common"
          readOnly: true
          subPath: "dataset"
        - mountPath: "/maven-log"
          name: "jenkins-common"
          readOnly: false
          subPath: "maven-log"

      resources:
        limits:
          memory: "16Gi"
          cpu: "16"
        requests:
          memory: "4Gi"
          cpu: "2"

    - name: "libchbuilder"
      tty: true
      command:
        - "cat"
      image: "qwe1398775315/libchbuilder:0.3.2"
      imagePullPolicy: "IfNotPresent"
      env:
        - name: HTTP_PROXY
          value: null
        - name: HTTPS_PROXY
          value: null
        - name: ENABLE_EMBEDED_COMPILER
          value: ON
      volumeMounts:
        - mountPath: "/ccache"
          name: "jenkins-common"
          readOnly: false
          subPath: "ccache"
        - mountPath: "/coredumps"
          name: "jenkins-common"
          readOnly: false
          subPath: "coredumps"
      resources:
        limits:
          memory: "30Gi"
          cpu: "16"
        requests:
          memory: "8Gi"
          cpu: "2"

  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-common"
    - name: "kyligence-repo"
      emptyDir: { }
    - name: "tmpfs"
      emptyDir:
        medium: Memory
        sizeLimit: 8096Mi
    - configMap:
        defaultMode: 0777
        items:
          - key: "settings.xml"
            path: "settings.xml"
        name: "aws-maven-settings"
      name: "maven-settings"
    - name: "dockersock"
      hostPath:
        path: "/var/run/docker.sock"

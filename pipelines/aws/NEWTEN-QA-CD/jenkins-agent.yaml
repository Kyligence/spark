---
kind: "Pod"
name: "jenkins-agent"
spec:
  containers:
    - volumeMounts:
        - mountPath: "/root/.m2"
          name: "jenkins-common"
          subPath: "maven3"
        - name: "kyligence-repo"
          mountPath: /root/.m2/repository/io/kyligence
        - mountPath: "/var/cicd"
          name: "jenkins-common-cd"
          subPath: "newten-cicd"
      tty: true
      command:
        - "cat"
      image: "sunfuzhou/newten-build:latest"
      imagePullPolicy: "IfNotPresent"
      name: "build"
      
    - name: "git"
      volumeMounts:
        - mountPath: "/jenkinscommon"
          name: "jenkins-common-cd"
      tty: true
      command:
        - "cat"
      image: "bitnami/git:latest"
      resources:
        limits:
          memory: "1000Mi"
          cpu: "1000m"
        requests:
          memory: "1000Mi"
          cpu: "1000m"

      
  volumes:
    - name: "jenkins-common-cd"
      persistentVolumeClaim:
        claimName: "jenkins-common-cd"
    - name: "kyligence-repo-cd"
      emptyDir: { }

---
kind: "Pod"
name: "jenkins-agent"
spec:
  nodeSelector:
    kubernetes.io/hostname: "kubernetes-work01"
  containers:
    - name: "git"
      tty: true
      command:
        - "cat"
      image: "bitnami/git:latest"

    - name: "maven"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-8"
      imagePullPolicy: "Always"
      volumeMounts:
        - name: "kyligence-repo"
          mountPath: /root/.m2/repository/io/kyligence
        - mountPath: "/root/.m2"
          name: "jenkins-common"
          subPath: "maven3"
        - mountPath: "/var/run/docker.sock"
          name: "dockersock"

  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-common"
    - name: "kyligence-repo"
      emptyDir: { }
    - name: "dockersock"
      hostPath:
        path: "/var/run/docker.sock"
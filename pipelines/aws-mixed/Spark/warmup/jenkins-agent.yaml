---
kind: "Pod"
name: "jenkins-agent"
spec:
  securityContext:
    fsGroup: 0
  containers:
    - name: "maven"
      tty: true
      command:
        - "cat"
      image: "maven:3.6.3-openjdk-8"
      imagePullPolicy: "IfNotPresent"
      volumeMounts:
        - name: "jenkins-common"
          mountPath: /var/jenkins_tmp
          subPath: "tmp"
        - name: "jenkins-common"
          mountPath: /root/.m2/repository
          subPath: "maven_repo"
        - mountPath: "/root/.m2/settings.xml"
          name: "maven-settings"
          readOnly: false
          subPath: "settings.xml"
        - name: "jenkins-common"
          mountPath: /var/jacoco
          subPath: "jacoco"
        - name: "jenkins-common"
          mountPath: /tools
          subPath: "tools"
        - name: "kyligence-repo"
          mountPath: /root/.m2/repository/io/kyligence
        - name: "kylin-repo"
          mountPath: /root/.m2/repository/org/apache/kylin
        - name: "spark-repo"
          mountPath: /root/.m2/repository/org/apache/spark
      resources:
        requests:
          memory: "8Gi"
          cpu: "3"
          ephemeral-storage: "5Gi"
  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "fileserver-claim"
    # - name: "jenkins-tmp"
    #   persistentVolumeClaim:
    #     claimName: "fileserver-claim1"
    - name: "kyligence-repo"
      emptyDir: { }
    - name: "kylin-repo"
      emptyDir: { }
    - name: "spark-repo"
      emptyDir: { }
    - configMap:
        defaultMode: 0777
        items:
          - key: "settings.xml"
            path: "settings.xml"
        name: "newten-maven-settings"
      name: "maven-settings"
---
kind: "Pod"
name: "jenkins-agent"
spec:
  containers:
    - name: "git"
      volumeMounts:
        - mountPath: "/jenkinscommon"
          name: "jenkins-common"
      tty: true
      command:
        - "cat"
      image: "bitnami/git:latest"
      resources:
        limits:
          memory: "1000Mi"
          cpu: "1000m"
        requests:
          memory: "1000Mi"
          cpu: "1000m"

    - name: "maven"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-8"
      imagePullPolicy: "Always"
      volumeMounts:
        - mountPath: "/root/.m2/settings.xml"
          name: "maven-settings"
          readOnly: false
          subPath: "settings.xml"
      resources:
        limits:
          memory: "48000Mi"
          cpu: "16000m"
        requests:
          memory: "48000Mi"
          cpu: "16000m"

    - name: "sonar-cloud"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-11"
      imagePullPolicy: "Always"
      volumeMounts:
        - mountPath: "/root/.m2/settings.xml"
          name: "maven-settings"
          readOnly: false
          subPath: "settings.xml"
      resources:
        limits:
          memory: "2000Mi"
          cpu: "2000m"
        requests:
          memory: "2000Mi"
          cpu: "2000m"

  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-common"
    - configMap:
        defaultMode: 0777
        items:
          - key: "settings.xml"
            path: "settings.xml"
        name: "ke-maven-settings"
      name: "maven-settings"
---
kind: "Pod"
name: "jenkins-agent"
spec:
  containers:
    - name: "git"
      volumeMounts:
        - mountPath: "/jenkinscommon"
          name: "jenkins-common"
      tty: true
      command:
        - "cat"
      image: "bitnami/git:latest"
      resources:
        limits:
          memory: "4000Mi"
          cpu: "2000m"
        requests:
          memory: "4000Mi"
          cpu: "2000m"

    - name: "maven"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-8"
      imagePullPolicy: "Always"
      volumeMounts:
        - name: "kyligence-repo"
          mountPath: /jenkins-common/.kem2/repository
          readOnly: false
        - mountPath: "/root/.m2/settings.xml"
          name: "maven-settings"
          readOnly: false
          subPath: "settings.xml"
      resources:
        limits:
          memory: "6000Mi"
          cpu: "3000m"
        requests:
          memory: "6000Mi"
          cpu: "3000m"

    - name: "utest-stage-1"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-8"
      imagePullPolicy: "Always"
      volumeMounts:
        - name: "kyligence-repo"
          mountPath: /jenkins-common/.kem2/repository
          readOnly: false
        - mountPath: "/root/.m2/settings.xml"
          name: "maven-settings"
          readOnly: false
          subPath: "settings.xml"
      resources:
        limits:
          memory: "16000Mi"
          cpu: "8000m"
        requests:
          memory: "16000Mi"
          cpu: "8000m"

    - name: "utest-stage-2"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-8"
      imagePullPolicy: "Always"
      volumeMounts:
        - name: "kyligence-repo"
          mountPath: /jenkins-common/.kem2/repository
          readOnly: false
        - mountPath: "/root/.m2/settings.xml"
          name: "maven-settings"
          readOnly: false
          subPath: "settings.xml"
      resources:
        limits:
          memory: "16000Mi"
          cpu: "8000m"
        requests:
          memory: "16000Mi"
          cpu: "8000m"

    - name: "itest-stage-1"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-8"
      imagePullPolicy: "Always"
      volumeMounts:
        - name: "kyligence-repo"
          mountPath: /jenkins-common/.kem2/repository
          readOnly: false
        - mountPath: "/root/.m2/settings.xml"
          name: "maven-settings"
          readOnly: false
          subPath: "settings.xml"
      resources:
        limits:
          memory: "16000Mi"
          cpu: "8000m"
        requests:
          memory: "16000Mi"
          cpu: "8000m"

    - name: "itest-stage-2"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-8"
      imagePullPolicy: "Always"
      volumeMounts:
        - name: "kyligence-repo"
          mountPath: /jenkins-common/.kem2/repository
          readOnly: false
        - mountPath: "/root/.m2/settings.xml"
          name: "maven-settings"
          readOnly: false
          subPath: "settings.xml"
      resources:
        limits:
          memory: "16000Mi"
          cpu: "8000m"
        requests:
          memory: "16000Mi"
          cpu: "8000m"

    - name: "sonar-cloud"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-11"
      imagePullPolicy: "Always"
      volumeMounts:
        - name: "kyligence-repo"
          mountPath: /jenkins-common/.kem2/repository
          readOnly: false
        - mountPath: "/root/.m2/settings.xml"
          name: "maven-settings"
          readOnly: false
          subPath: "settings.xml"
      resources:
        limits:
          memory: "6000Mi"
          cpu: "3000m"
        requests:
          memory: "6000Mi"
          cpu: "3000m"

  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-common"
    - name: "kyligence-repo"
      emptyDir: { }
    - configMap:
        defaultMode: 0777
        items:
          - key: "settings.xml"
            path: "settings.xml"
        name: "ke-maven-settings"
      name: "maven-settings"
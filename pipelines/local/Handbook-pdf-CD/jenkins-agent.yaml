---
kind: "Pod"
name: "handbook-agent"
spec:
  containers:
    - name: "git"
      image: "bitnami/git:latest"
      volumeMounts:
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
      tty: true
      command:
        - "cat"
      resources:
        limits:
          memory: "1Gi"
          cpu: "1000m"
    - name: "build"
      image: "repo-ofs.kyligence.tech:5000/handbook:0.1"
      imagePullPolicy: "IfNotPresent"
      tty: true
      command:
        - "cat"
      resources:
        limits:
          memory: "4Gi"
          cpu: "2000m"
      volumeMounts:
        - mountPath: "/gitbook"
          name: "jenkins-common"
          subPath: "handbook"
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-common"

---
kind: "Pod"
name: "jenkins-agent"
spec:
  containers:
    - volumeMounts:
        - mountPath: "/root/.m2"
          name: "jenkins-common"
          subPath: "maven3"
        - name: "kyligence-repo"
          mountPath: /root/.m2/repository/io/kyligence
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
      tty: true
      command:
        - "cat"
      image: "10.1.9.11:31500/kydocker/newten-build:latest"
      imagePullPolicy: "Always"
      name: "build"
  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-common"
    - name: "kyligence-repo"
      emptyDir: { }
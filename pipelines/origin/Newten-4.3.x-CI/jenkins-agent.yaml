---
kind: "Pod"
name: "jenkins-agent"
spec:
  containers:
    - name: "git"
      volumeMounts:
        - mountPath: "/var/cicd"
          name: "jenkins-common"
          subPath: "newten-cicd"
      tty: true
      command:
        - "cat"
      image: "bitnami/git:latest"

    - name: "maven"
      tty: true
      command:
        - "cat"
      image: "maven:3.8.3-openjdk-8"
      imagePullPolicy: "Always"
      volumeMounts:
        - name: "kyligence-repo"
          mountPath: /root/.m2/repository/io/kyligence
        - mountPath: "/root/.m2"
          name: "jenkins-common"
          subPath: "maven3"

  volumes:
    - name: "jenkins-common"
      persistentVolumeClaim:
        claimName: "jenkins-common"
    - name: "kyligence-repo"
      emptyDir: { }